<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Kontrola warstwa – losowanie pól</title>

<style>
:root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --primary: #2563eb;
    --primary-hover: #1e40af;
    --accent: #f59e0b;
    --border: #d1d5db;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.panel {
    background: var(--panel);
    padding: 20px 25px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    margin-bottom: 20px;
    width: 100%;
    max-width: 520px;
}

h2 {
    margin-top: 0;
    text-align: center;
}

.meta {
    text-align: center;
    font-size: 14px;
    color: #374151;
    margin-top: -6px;
    margin-bottom: 14px;
}

.controls {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 15px;
}

.control {
    display: flex;
    flex-direction: column;
    font-size: 14px;
}

.control label {
    margin-bottom: 4px;
    color: #374151;
}

.control input {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 15px;
}

.buttons {
    display: flex;
    gap: 10px;
    justify-content: space-between;
}

button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    color: white;
    background: var(--primary);
}

button:hover { background: var(--primary-hover); }

button.secondary {
    background: #111827;
}
button.secondary:hover {
    background: #000000;
}

.grid-container {
    display: flex;
    justify-content: center;
    width: 100%;
}

.grid-wrap {
    background: white;
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.06);
}

.grid {
    display: grid;
    gap: 3px;
}

.cell {
    width: 30px;
    height: 30px;
    background: #e5e7eb;
    border: 1px solid #cbd5e1;
}

.cell.active { background: var(--accent); }
</style>
</head>

<body>

<div class="panel">
    <h2>Kontrola warstwa – sztuki do kontroli</h2>
    <div class="meta" id="metaN">Liczba pól z Glide: —</div>

    <div class="controls">
        <div class="control">
            <label>Y (wiersze)</label>
            <input type="number" id="rows" value="10" min="1">
        </div>

        <div class="control">
            <label>X (kolumny)</label>
            <input type="number" id="cols" value="10" min="1">
        </div>
    </div>

    <div class="buttons">
        <button onclick="generateGrid()">Generuj</button>
        <button onclick="randomize()">Losuj</button>
        <button class="secondary" onclick="saveImage()">Zapisz obraz</button>
    </div>
</div>

<div class="grid-container">
  <div class="grid-wrap" id="capture">
      <div id="grid" class="grid"></div>
  </div>
</div>

<!-- biblioteka do zrzutu do PNG -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
let rows = 0;
let cols = 0;
let cells = [];
let N_FROM_GLIDE = 10;

const grid = document.getElementById("grid");
const rowsInput = document.getElementById("rows");
const colsInput = document.getElementById("cols");
const metaN = document.getElementById("metaN");

function getParamInt(name, fallback) {
  const v = new URLSearchParams(window.location.search).get(name);
  const n = parseInt(v, 10);
  return Number.isFinite(n) ? n : fallback;
}

function updateMeta() {
  metaN.textContent = `Liczba pól z Glide: ${N_FROM_GLIDE}`;
}

window.addEventListener("DOMContentLoaded", () => {
  N_FROM_GLIDE = Math.max(1, getParamInt("n", 10));
  updateMeta();
});

function generateGrid() {
    rows = Math.max(1, +rowsInput.value);
    cols = Math.max(1, +colsInput.value);

    grid.innerHTML = "";
    grid.style.gridTemplateColumns = `repeat(${cols}, 30px)`;
    cells = [];

    for (let r = 0; r < rows; r++) {
        cells[r] = [];
        for (let c = 0; c < cols; c++) {
            const d = document.createElement("div");
            d.className = "cell";
            grid.appendChild(d);
            cells[r][c] = d;
        }
    }
}

function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

function randomize() {
    if (!cells.length) return;

    const maxCells = rows * cols;
    const ILE_POLOW = Math.min(maxCells, Math.max(1, N_FROM_GLIDE));

    cells.flat().forEach(c => c.classList.remove("active"));

    // FIX: gdy ILE_POLOW == 1, losujemy dokładnie 1 pole
    if (ILE_POLOW === 1) {
        const r = Math.floor(Math.random() * rows);
        const c = Math.floor(Math.random() * cols);
        cells[r][c].classList.add("active");
        return;
    }

    if (rows >= ILE_POLOW) {
        if (rows === ILE_POLOW) {
            for (let r = 0; r < rows; r++) {
                const c = Math.floor(Math.random() * cols);
                cells[r][c].classList.add("active");
            }
        } else {
            const availableRows = Array.from({length: rows}, (_, i) => i);

            // wybierz ILE_POLOW unikalnych wierszy
            const selectedRows = shuffle(availableRows).slice(0, ILE_POLOW);

            selectedRows.forEach(r => {
                const c = Math.floor(Math.random() * cols);
                cells[r][c].classList.add("active");
            });
        }
    } else {
        const selected = new Set();

        while (selected.size < ILE_POLOW) {
            const r = Math.floor(Math.random() * rows);
            const c = Math.floor(Math.random() * cols);
            selected.add(`${r},${c}`);
        }

        for (const key of selected) {
            const [r, c] = key.split(",").map(Number);
            cells[r][c].classList.add("active");
        }
    }
}

async function saveImage() {
    if (!cells.length) return;

    const el = document.getElementById("capture");
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: "#ffffff" });

    const dataUrl = canvas.toDataURL("image/png");

    // wymuszenie pobrania
    const a = document.createElement("a");
    a.href = dataUrl;
    a.download = `losowanie_${rows}x${cols}_n${N_FROM_GLIDE}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
}
</script>

</body>
</html>
