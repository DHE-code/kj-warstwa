<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Kontrola warstwa – losowanie pól</title>

<style>
:root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --primary: #2563eb;
    --primary-hover: #1e40af;
    --accent: #f59e0b;
    --border: #d1d5db;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.panel {
    background: var(--panel);
    padding: 20px 25px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    margin-bottom: 20px;
    width: 100%;
    max-width: 520px;
}

h2 {
    margin-top: 0;
    text-align: center;
}

.controls {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 15px;
}

.control {
    display: flex;
    flex-direction: column;
    font-size: 14px;
}

.control label {
    margin-bottom: 4px;
    color: #374151;
}

.control input {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 15px;
}

.buttons {
    display: flex;
    gap: 10px;
    justify-content: space-between;
}

button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    color: white;
    background: var(--primary);
}

button:hover { background: var(--primary-hover); }

button.secondary {
    background: #111827;
}
button.secondary:hover {
    background: #000000;
}

.grid-container {
    display: flex;
    justify-content: center;
    width: 100%;
}

.grid-wrap {
    background: white;
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.06);
}

.grid {
    display: grid;
    gap: 3px;
}

.cell {
    width: 30px;
    height: 30px;
    background: #e5e7eb;
    border: 1px solid #cbd5e1;
}

.cell.active { background: var(--accent); }
</style>
</head>

<body>

<div class="panel">
    <h2>Kontrola warstwa – sztuki do kontroli</h2>

    <div class="controls">
        <div class="control">
            <label>Y (wiersze)</label>
            <input type="number" id="rows" value="10" min="1">
        </div>

        <div class="control">
            <label>X (kolumny)</label>
            <input type="number" id="cols" value="10" min="1">
        </div>
    </div>

    <div class="buttons">
        <button onclick="generateGrid()">Generuj</button>
        <button onclick="randomize()">Losuj</button>
        <button class="secondary" onclick="saveImage()">Zapisz obraz</button>
    </div>
</div>

<div class="grid-container">
  <div class="grid-wrap" id="capture">
      <div id="grid" class="grid"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
const ILE_POLOW = 10;

let rows = 0;
let cols = 0;
let cells = [];

const grid = document.getElementById("grid");
const rowsInput = document.getElementById("rows");
const colsInput = document.getElementById("cols");


function getParam(name) {
  const v = new URLSearchParams(window.location.search).get(name);
  return v ? v.trim() : "";
}

const WEBHOOK_URL = getParam("webhook");


function generateGrid() {
    rows = Math.max(1, +rowsInput.value);
    cols = Math.max(1, +colsInput.value);

    grid.innerHTML = "";
    grid.style.gridTemplateColumns = `repeat(${cols}, 30px)`;
    cells = [];

    for (let r = 0; r < rows; r++) {
        cells[r] = [];
        for (let c = 0; c < cols; c++) {
            const d = document.createElement("div");
            d.className = "cell";
            grid.appendChild(d);
            cells[r][c] = d;
        }
    }
}

function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

function clearActive() {
  if (!cells.length) return;
  cells.flat().forEach(c => c.classList.remove("active"));
}

function setActive(r, c) {
  cells[r][c].classList.add("active");
}

function randomCol() {
  return Math.floor(Math.random() * cols);
}


function randomize() {
    if (!cells.length) return;

    clearActive();

    const totalCells = rows * cols;
    const target = Math.min(ILE_POLOW, totalCells);

    if (rows === 1) {
      const used = new Set();
      while (used.size < target) {
        const c = randomCol();
        used.add(c);
      }
      for (const c of used) setActive(0, c);
      return;
    }

    if (rows > ILE_POLOW) {
        const selectedRows = new Set();
        selectedRows.add(0);
        selectedRows.add(rows - 1);

        const middle = Array.from({length: rows - 2}, (_, i) => i + 1);
        shuffle(middle);

        while (selectedRows.size < ILE_POLOW) {
          selectedRows.add(middle.pop());
        }

        for (const r of selectedRows) {
          setActive(r, randomCol());
        }
        return;
    }

    for (let r = 0; r < rows; r++) {
      setActive(r, randomCol());
    }

    let already = rows;
    let remaining = target - already;
    if (remaining <= 0) return;

    const activeSet = new Set();
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (cells[r][c].classList.contains("active")) activeSet.add(`${r},${c}`);
      }
    }

    while (remaining > 0) {
      const r = Math.floor(Math.random() * rows);
      const c = randomCol();
      const key = `${r},${c}`;
      if (!activeSet.has(key)) {
        activeSet.add(key);
        setActive(r, c);
        remaining--;
      }
    }
}


async function sendToWebhook(webhookUrl, payload) {
  const res = await fetch(webhookUrl, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });

  if (!res.ok) {
    const txt = await res.text().catch(() => "");
    throw new Error(`Webhook HTTP ${res.status} ${res.statusText} ${txt}`);
  }

  try { return await res.json(); }
  catch { return await res.text(); }
}


async function saveImage() {
    if (!cells.length) return;

    const el = document.getElementById("capture");
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: "#ffffff" });
    const dataUrl = canvas.toDataURL("image/png");

    // zapis lokalny
    const a = document.createElement("a");
    a.href = dataUrl;
    a.download = `losowanie_${rows}x${cols}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();

    // wysyłka do webhooka
    if (WEBHOOK_URL) {
      const payload = {
        filename: `losowanie_${rows}x${cols}.png`,
        rows,
        cols,
        image_data_url: dataUrl,
        active: cells.flatMap((cell, idx) => {
          if (!cell.classList.contains("active")) return [];
          const r = Math.floor(idx / cols);
          const c = idx % cols;
          return [{ r, c }];
        }),
        ts: new Date().toISOString(),
      };

      await sendToWebhook(WEBHOOK_URL, payload);
    }
}
</script>


</body>
</html>
