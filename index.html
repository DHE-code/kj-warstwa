<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Kontrola warstwa – losowanie pól</title>

<style>
:root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --primary: #2563eb;
    --primary-hover: #1e40af;
    --accent: #f59e0b;
    --border: #d1d5db;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.panel {
    background: var(--panel);
    padding: 20px 25px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    margin-bottom: 20px;
    width: 100%;
    max-width: 520px;
}

h2 {
    margin-top: 0;
    text-align: center;
}

.controls {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 15px;
}

.control {
    display: flex;
    flex-direction: column;
    font-size: 14px;
}

.control label {
    margin-bottom: 4px;
    color: #374151;
}

.control input {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 15px;
}

.buttons {
    display: flex;
    gap: 10px;
    justify-content: space-between;
}

button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    color: white;
    background: var(--primary);
}

button:hover { background: var(--primary-hover); }

button.secondary {
    background: #111827;
}
button.secondary:hover {
    background: #000000;
}

.grid-container {
    display: flex;
    justify-content: center;
    width: 100%;
}

.grid-wrap {
    background: white;
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.06);
}

.grid {
    display: grid;
    gap: 3px;
}

.cell {
    width: 30px;
    height: 30px;
    background: #e5e7eb;
    border: 1px solid #cbd5e1;
}

.cell.active { background: var(--accent); }
</style>
</head>

<body>

<div class="panel">
    <h2>Kontrola warstwa – sztuki do kontroli</h2>

    <div class="controls">
        <div class="control">
            <label>Y (wiersze)</label>
            <input type="number" id="rows" value="10" min="1">
        </div>

        <div class="control">
            <label>X (kolumny)</label>
            <input type="number" id="cols" value="10" min="1">
        </div>
    </div>

    <div class="buttons">
        <button onclick="generateGrid()">Generuj</button>
        <button onclick="randomize()">Losuj</button>
        <button class="secondary" onclick="saveImage()">Zapisz obraz</button>
    </div>
</div>

<div class="grid-container">
  <div class="grid-wrap" id="capture">
      <div id="grid" class="grid"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
/* ================== CONFIG ================== */
const ILE_POLOW = 10;

/* ================== STATE ================== */
let rows = 0;
let cols = 0;
let cells = [];

const grid = document.getElementById("grid");
const rowsInput = document.getElementById("rows");
const colsInput = document.getElementById("cols");

/* ================== URL PARAMS ================== */
function getParam(name) {
  const v = new URLSearchParams(window.location.search).get(name);
  return v ? v.trim() : "";
}

// Link w Glide buduj tak:
// https://dhe-code.github.io/kj-warstwa/?id_box=123&numer_warstwy=2&webhook=MAKE_WEBHOOK
const WEBHOOK_URL = getParam("webhook");
const ID_BOX = getParam("id_box");
const NUMER_WARSTWY = getParam("numer_warstwy");

/* ================== GRID ================== */
function generateGrid() {
  rows = Math.max(1, +rowsInput.value);
  cols = Math.max(1, +colsInput.value);

  grid.innerHTML = "";
  grid.style.gridTemplateColumns = `repeat(${cols}, 30px)`;
  cells = [];

  for (let r = 0; r < rows; r++) {
    cells[r] = [];
    for (let c = 0; c < cols; c++) {
      const d = document.createElement("div");
      d.className = "cell";
      grid.appendChild(d);
      cells[r][c] = d;
    }
  }
}

function shuffle(arr) {
  return arr.sort(() => Math.random() - 0.5);
}

function clearActive() {
  if (!cells.length) return;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = cells[r]?.[c];
      if (cell) cell.classList.remove("active");
    }
  }
}

function setActive(r, c) {
  const cell = cells[r]?.[c];
  if (cell) cell.classList.add("active");
}

function randomCol() {
  return Math.floor(Math.random() * cols);
}

/* ================== RANDOMIZE ================== */
function randomize() {
  if (!cells.length) return;

  clearActive();

  const totalCells = rows * cols;
  const target = Math.min(ILE_POLOW, totalCells);

  if (rows === 1) {
    const used = new Set();
    while (used.size < target) used.add(randomCol());
    for (const c of used) setActive(0, c);
    return;
  }

  if (rows > ILE_POLOW) {
    const selectedRows = new Set([0, rows - 1]);

    const middle = Array.from({ length: rows - 2 }, (_, i) => i + 1);
    shuffle(middle);

    while (selectedRows.size < ILE_POLOW) selectedRows.add(middle.pop());

    for (const r of selectedRows) setActive(r, randomCol());
    return;
  }

  // rows <= 10: każdy wiersz ma 1 pole
  for (let r = 0; r < rows; r++) setActive(r, randomCol());

  let remaining = target - rows;
  if (remaining <= 0) return;

  const activeSet = new Set();
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = cells[r]?.[c];
      if (cell && cell.classList.contains("active")) activeSet.add(`${r},${c}`);
    }
  }

  while (remaining > 0) {
    const r = Math.floor(Math.random() * rows);
    const c = randomCol();
    const key = `${r},${c}`;
    if (!activeSet.has(key)) {
      activeSet.add(key);
      setActive(r, c);
      remaining--;
    }
  }
}

/* ================== SAVE IMAGE (MULTIPART -> MAKE) ================== */
async function saveImage() {
  if (!cells.length) return;

  // aktywne pola
  const active = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = cells[r]?.[c];
      if (cell && cell.classList.contains("active")) {
        active.push({ r, c });
      }
    }
  }

  if (active.length === 0) {
    alert("Najpierw kliknij: Losuj");
    return;
  }

  if (!ID_BOX || !NUMER_WARSTWY || !WEBHOOK_URL) {
    alert("Brakuje parametrów id_box / numer_warstwy / webhook w linku.");
    return;
  }

  const el = document.getElementById("capture");
  const canvas = await html2canvas(el, { scale: 2, backgroundColor: "#ffffff" });

  const filename = `losowanie_${rows}x${cols}_box${ID_BOX}_w${NUMER_WARSTWY}.png`;

  // blob z canvasa
  const blob = await new Promise((resolve, reject) => {
    canvas.toBlob((b) => {
      if (b) resolve(b);
      else reject(new Error("Błąd canvas.toBlob"));
    }, "image/png");
  });

  // zapis lokalny (opcjonalnie – zostawiam jak było)
  const localUrl = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = localUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(localUrl);

  // multipart do Make
  const fd = new FormData();

  // plik binarny
  fd.append("file", blob, filename);

  // pola tekstowe (osobno jak chciałeś)
  fd.append("id_box", ID_BOX);
  fd.append("numer_warstwy", NUMER_WARSTWY);
  fd.append("filename", filename);
  fd.append("rows", String(rows));
  fd.append("cols", String(cols));
  fd.append("active", JSON.stringify(active));
  fd.append("ts", new Date().toISOString());
  fd.append("page_url", window.location.href);

  try {
    await fetch(WEBHOOK_URL, {
      method: "POST",
      body: fd,
      keepalive: true,
    });
  } catch (e) {
    console.error("Webhook send failed:", e);
    alert("Nie udało się wysłać do webhooka (szczegóły w konsoli).");
  }
}
</script>


</body>
</html>
